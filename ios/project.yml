name: AIStudio
options:
  bundleIdPrefix: app.aistudio
  deploymentTarget:
    iOS: "15.0"
targets:
  AIStudio:
    type: application
    platform: iOS
    sources:
      - AIStudio
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: AIStudio/Info.plist
      properties:
        CFBundleDisplayName: AI Studio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Attach photos to your chats.
        NSCameraUsageDescription: Take a photo to send in a chat.
        NSMicrophoneUsageDescription: Talk to the AI instead of typing.
        NSSpeechRecognitionUsageDescription: Turn your voice into text for your message.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aistudio.vnai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
