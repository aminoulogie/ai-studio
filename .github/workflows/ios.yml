name: Build iOS IPA

on:
  push:
    paths: ['index.html', 'ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bundle web app (libraries inside the app — no code loaded from the internet)
        run: |
          mkdir -p ios/www && cp index.html ios/www/index.html
          python3 ios/scripts/inline_libs.py ios/www/index.html

      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIStudio.app Payload/
          zip -qry AIStudio.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AIStudio-ipa
          path: ios/AIStudio.ipa
          retention-days: 30

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Studio v1.0.${{ github.run_number }}
          body: |
            iPhone app (unsigned IPA). Sign/install with Sideloadly, AltStore, ESign or Feather, then paste your vnaipro key.
          files: ios/AIStudio.ipa
