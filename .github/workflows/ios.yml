name: Build iOS IPA

on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'tests/**', 'ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['index.html', 'assets/**', 'tests/**', 'ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test optimizer and request recovery
        run: |
          node tests/optimizer.cjs
          node tests/code-runtime.cjs
          node tests/git-workflow.cjs
          node tests/repo-privacy.cjs
          node scripts/check-private-data.cjs
          node tests/claude-observer.cjs
          node tests/shared-memory.cjs
          node tests/claude-bridge.cjs
          node tests/ota-update.cjs
          bash -n scripts/git-setup.sh ios/scripts/build-ipa.sh
      - name: Install browser checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit chromium
      - name: Verify iPhone and desktop layouts
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: test-artifacts/
  build:
    runs-on: macos-15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install artwork tools
        run: |
          python3 -m venv .art-tools
          .art-tools/bin/pip install numpy==2.2.6 Pillow==11.3.0

      - name: Bundle UI and original Retina artwork
        run: |
          mkdir -p ios/www
          cp index.html ios/www/index.html
          cp -R assets ios/www/assets
          .art-tools/bin/python ios/scripts/generate_artwork.py
          python3 ios/scripts/inline_libs.py ios/www/index.html

      - name: Write web update manifest
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          page = Path('ios/www/index.html').read_bytes()
          observer = Path('ios/AIStudio/claude-observer.js').read_bytes()
          manifest = {
              'version': int(os.environ['RUN_NUMBER']),
              'sha256': hashlib.sha256(page).hexdigest(),
              'size': len(page),
              'min_native': 1,
              'observer_sha256': hashlib.sha256(observer).hexdigest(),
              'observer_size': len(observer),
          }
          text = json.dumps(manifest, indent=2)
          Path('ios/www/studio-web.json').write_text(text)
          Path('ios/studio-web.json').write_text(text)
          Path('ios/studio-web.html').write_bytes(page)
          Path('ios/studio-observer.js').write_bytes(observer)
          print(text)
          PY

      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Test Claude profile isolation and context state
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          cd ios
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath test-build \
            IPHONEOS_DEPLOYMENT_TARGET=18.4 CODE_SIGNING_ALLOWED=NO test

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project AIStudio.xcodeproj -scheme AIStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AIStudio.app Payload/
          zip -qry AIStudio.ipa Payload
          python3 - <<'PY'
          from pathlib import Path
          size = Path('AIStudio.ipa').stat().st_size
          print(f'IPA size: {size / 1024**2:.2f} MiB')
          assert size >= 20 * 1024**2, 'IPA must contain at least 20 MiB of app and functional artwork'
          PY

      - name: Name the IPA with its version
        run: cp ios/AIStudio.ipa ios/AIStudio-v1.0.${{ github.run_number }}.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIStudio-v1.0.${{ github.run_number }}
          path: ios/AIStudio-v1.0.${{ github.run_number }}.ipa
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          name: AI Studio v1.0.${{ github.run_number }}
          body: |
            iPhone app (unsigned IPA). Sign/install with Sideloadly, AltStore, ESign or Feather, Claude tab uses isolated official claude.ai sign-ins (iOS 17+). Studio model connections remain separate.
          files: |
            ios/AIStudio-v1.0.${{ github.run_number }}.ipa
            ios/studio-web.html
            ios/studio-web.json
            ios/studio-observer.js
