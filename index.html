/* ===================== BASICS ===================== */
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function inApp(){try{return !!window.webkit?.messageHandlers?.native;}catch{return false;}}
function native(o){return window.webkit.messageHandlers.native.postMessage(o);}
let secureGitHubToken='';
function ls(k,v){try{
  if(k==='gh_token'&&inApp()){
    if(v===undefined)return secureGitHubToken;
    secureGitHubToken=v||'';
    native({op:'credentialSet',name:'github',value:secureGitHubToken}).catch(e=>toast('Could not save GitHub sign-in: '+e.message));return;
  }
  if(v===undefined)return localStorage.getItem(k);
  if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
}catch{return null;}}
function lsj(k){try{return JSON.parse(ls(k));}catch{return null;}}
async function bootGitHubCredential(){
  if(!inApp())return;
  const legacy=localStorage.getItem('gh_token');
  if(legacy){await native({op:'credentialSet',name:'github',value:legacy});localStorage.removeItem('gh_token');}
  secureGitHubToken=await native({op:'credentialGet',name:'github'})||'';
}
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function autosize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,innerHeight*.38)+'px';}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function short(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';}

function icon(name,cls='ic'){return '<svg class="'+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';}
/* The terracotta spark: twelve tapered rays. */
function spark(){
  let d='';
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6+(k%2?0.08:0),r=k%2?8.6:11,w=k%2?0.95:1.25;
    const x=Math.cos(a),y=Math.sin(a),px=-y*w,py=x*w,f=n=>n.toFixed(2);
    d+='M'+f(12+px)+' '+f(12+py)+'L'+f(12+x*r)+' '+f(12+y*r)+'L'+f(12-px)+' '+f(12-py)+'Z';
  }
  return '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/></svg>';
}
function drawIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{if(!el.dataset.drawn){el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon));el.dataset.drawn='1';}});}

/* Markdown, the subset Claude uses. Code blocks are escaped and highlighted after render. */
function md(text){
  const blocks=[];
  let o=String(text||'').replace(/\r/g,'').replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g,(_,lang,code)=>{
    blocks.push('<div class="codeblock"><header><span>'+esc(lang||'code')+'</span><button onclick="copyCode(this)">Copy</button></header><pre><code class="language-'+esc(lang||'plaintext')+'">'+esc(code.replace(/\n$/,''))+'</code></pre></div>');
    return '\n\u0000'+(blocks.length-1)+'\u0000\n';
  });
  o=esc(o);
  o=o.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^---+$/gm,'<hr>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  o=o.replace(/(?:^[ \t]*[-*+] .+(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*[-*+] /,'')+'</li>').join('')+'</ul>\n');
  o=o.replace(/(?:^[ \t]*\d+[.)] .+(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*\d+[.)] /,'')+'</li>').join('')+'</ol>\n');
  o=o.split(/\n{2,}/).map(p=>{p=p.trim();if(!p)return '';if(/^(<(h\d|ul|ol|blockquote|hr)|\u0000)/.test(p))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
  return o.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[+i]);
}
function highlight(root){if(typeof hljs==='undefined')return;root.querySelectorAll('.codeblock code:not([data-hl])').forEach(el=>{try{hljs.highlightElement(el);}catch{}el.dataset.hl='1';});}
function copyCode(btn){const code=btn.closest('.codeblock').querySelector('code').textContent;navigator.clipboard?.writeText(code).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1600);}).catch(()=>toast('Copy failed'));}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy failed'));}

/* ===================== STATE ===================== */
const A=window.StudioAgents;
const S={token:'',user:null,repos:[],paths:{},files:{},sessions:{},cur:null,profiles:[],busy:false,stop:false,atts:[],memory:''};
const gh=makeGitHub(()=>S.token);
function sess(){return S.sessions[S.cur]||null;}
function teamMode(){return ls('team_mode')||'team';}
function parallel(){return Math.max(1,Math.min(6,Number(ls('team_parallel'))||3));}
function autoCommit(){return ls('auto_commit')==='1';}
/** Boss (manager) and sub-agent model and effort. "Auto" for sub-agents lets the boss choose per task. */
function bossModel(){return ls('boss_model')||'Opus 5.5';}
function bossEffort(){return ls('boss_effort')||'High';}
function subModel(){return ls('sub_model')||'Auto';}
function subEffort(){return ls('sub_effort')||'Auto';}
const fixed=v=>v==='Auto'||v==='Account default'?'':v;
const paid=p=>!!p?.plan&&p.plan!=='free';
function planTag(p){return p.plan?'<span class="pill '+(paid(p)?'star':'')+'">'+esc(p.plan==='max'?'Max':p.plan[0].toUpperCase()+p.plan.slice(1))+'</span>':'';}

/* Sessions live in IndexedDB on this device: the conversation, staged edits and the commit they started from. */
let dbPromise,dbHandle=null;
function db(){
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open('ai-studio-sessions',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('sessions',{keyPath:'id'});
    r.onsuccess=()=>{dbHandle=r.result;resolve(r.result);};r.onerror=()=>reject(r.error);
  });
  return dbPromise;
}
async function loadSessions(){
  try{
    const d=await db();
    const all=await new Promise((res,rej)=>{const q=d.transaction('sessions').objectStore('sessions').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
    for(const s of all){
      // A task that was running when the app closed cannot resume; say so instead of spinning forever.
      for(const e of s.log||[])if(['working','planning','sending','awaiting','queued','streaming'].includes(e.state)){e.state='failed';e.note='Interrupted when the app closed. Send again to retry.';(e.tasks||[]).forEach(t=>{if(!['done','failed','partial'].includes(t.state)){t.state='failed';t.note='Interrupted';}});}
      S.sessions[s.id]=s;
    }
  }catch{}
}
const saveTimers={};
// Written synchronously once the database is open, so a save started as the app closes still lands.
async function writeSession(s){
  try{const d=dbHandle||await db();d.transaction('sessions','readwrite').objectStore('sessions').put(JSON.parse(JSON.stringify(s)));}catch{toast('Could not save this session on the device.');}
}
/** Writes at once, then at most every 300 ms while a task streams; later changes never postpone a write. */
const lastWrite={};
function save(s=sess()){
  if(!s)return;
  s.ts=Date.now();
  if(saveTimers[s.id])return;
  const wait=300-(Date.now()-(lastWrite[s.id]||0));
  const run=()=>{delete saveTimers[s.id];lastWrite[s.id]=Date.now();writeSession(s);};
  if(wait<=0)run();else saveTimers[s.id]=setTimeout(run,wait);
}
/** Writes pending saves now: the app can be closed or reloaded at any moment. */
function flushSaves(){for(const id of Object.keys(saveTimers)){clearTimeout(saveTimers[id]);delete saveTimers[id];if(S.sessions[id])writeSession(S.sessions[id]);}}
addEventListener('pagehide',flushSaves);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSaves();});
async function deleteSession(id){
  delete S.sessions[id];
  try{const d=await db();d.transaction('sessions','readwrite').objectStore('sessions').delete(id);}catch{}
  if(S.cur===id){S.cur=null;ls('cur_session',null);}
  renderAll();
}
function newSession(open=true){
  if(S.busy){toast('Wait for the current task, or stop it.');return null;}
  const repo=ls('repo')||'',branch=ls('branch')||'';
  const cur=sess();
  // An untouched session is reused instead of piling up empty ones.
  if(cur&&!cur.log.length&&!Object.keys(cur.staged).length&&cur.repo===repo&&cur.branch===branch){if(open){drawer(false);$('task').focus();}return cur;}
  const s={id:uid('s'),title:'',repo,branch,ts:Date.now(),log:[],staged:{},orig:{},baseSHA:null};
  S.sessions[s.id]=s;S.cur=s.id;ls('cur_session',s.id);
  if(open){drawer(false);renderAll();}
  return s;
}
function openSession(id){
  if(S.busy&&id!==S.cur){toast('Wait for the current task, or stop it.');return;}
  const s=S.sessions[id];if(!s)return;
  S.cur=id;ls('cur_session',id);
  if(s.repo){ls('repo',s.repo);ls('branch',s.branch);}
  drawer(false);renderAll();
}

/* ===================== GITHUB ===================== */
async function connectToken(){
  const tok=($('ghTokenInput')?.value||'').trim();if(!tok){toast('Paste a token first');return;}
  try{
    const user=await makeGitHub(()=>tok).gh('/user');
    S.token=tok;ls('gh_token',tok);S.user=user;ls('gh_user',JSON.stringify({login:user.login,avatar:user.avatar_url}));
    toast('Connected as '+user.login);S.repos=[];
    if($('sheet').dataset.kind==='settings')openSettings();
    renderAll();loadRepos().catch(()=>{});
  }catch(e){toast(e.message);}
}
function disconnectGitHub(){
  if(!confirm('Disconnect GitHub on this device?'))return;
  S.token='';ls('gh_token',null);S.user=null;ls('gh_user',null);S.repos=[];renderAll();openSettings();
}
let signInCancel=false;
async function deviceSignIn(){
  const cid=ls('gh_client_id');
  if(!cid){toast('Add your GitHub OAuth Client ID first.');return;}
  if(!inApp()){toast('Device sign-in works in the iPhone app. Use a token here.');return;}
  try{
    const r=JSON.parse(await native({op:'githubDeviceCode',clientId:cid}));
    if(!r.device_code)throw new Error(r.error_description||r.error||'GitHub refused. Is Device Flow enabled on the OAuth app?');
    navigator.clipboard?.writeText(r.user_code).catch(()=>{});
    signInCancel=false;

/** Recent history of the sub-agents together: what a message usually costs. */
function workerHist(){const d=usageDB();return Object.entries(d.profiles).filter(([id])=>!S.profiles.find(p=>p.id===id)?.manager).flatMap(([,r])=>r.hist).sort((a,b)=>a.t-b.t).slice(-60);}

function estimateJob(text,{profile,fresh=true,images=[]}={}){

/** One message to one container. Resolves with Claude's finished reply; events stream into onEvent. */
/** One message to one container. Resolves with Claude's finished reply; events stream into onEvent.

function claudeJob(text,{role='worker',fresh=true,profile,images=[],onEvent,moveOnLimit=true,model='',effort=''}={}){

    onEvent?.({id,state:'sending',est,note:''});

      .then(r=>{if(jobs[id])onEvent?.({id,state:'sending',account:r?.account||'',profile:r?.profile||'',note:''});})
      .catch(e=>{if(!jobs[id])return;delete jobs[id];const msg=e?.message||String(e);

/** Live updates from a container into a log entry. */
function follow(s,entry){
  return p=>{
    if(p.account)entry.account=p.account;
    if(p.profile)entry.profile=p.profile;
    if(p.note!==undefined&&p.note!=='')entry.note=p.note;
    if(p.state==='streaming'&&p.text)entry.text=p.text;
    if(['queued','sending','awaiting','streaming','switching'].includes(p.state))entry.state=p.state==='switching'?'sending':p.state;
    if(p.state==='streaming')entry.note='';
    if(p.est)entry.est=p.est;
    if(p.cost)entry.cost=p.cost;
    updateEntry(s,entry);
  };
}
// Sub-agents get whole files up to 40k characters and excerpts beyond; about 100k in total keeps free accounts going longer.
async function loadFiles(s,paths,{limit=40000,budget=100000}={}){
  const out=[];let used=0;
  for(const path of paths){
    const text=await currentText(path,s).catch(()=>null);
    const lim=Math.max(6000,Math.min(limit,budget-used));
    out.push({path,text,limit:lim});
    used+=Math.min(text?.length||0,lim);
    if(used>=budget)break;
  }
  return out;
}
/** Earlier in this session, in a few thousand characters, for a message that starts a new chat. No AI needed. */
function recap(s,upTo){
  const prior=s.log.slice(0,upTo);
  const lastHand=[...prior].reverse().find(e=>e.k==='handover');
  return prior.some(e=>e.k!=='user')?A.transcript(lastHand?prior.slice(prior.indexOf(lastHand)):prior,6000):'';

/**
 * Solo: one conversation in one container, so Claude remembers the session. When that container hits its
 * limit, a free sub-agent compresses the conversation and the next container continues from the handover.
 */
async function runSingle(s,goal,images,role){
  const paths=await ensureBase(s);
  const entry={k:'reply',state:'sending',text:'',account:'',ts:Date.now(),note:role==='manager'?'Opening your manager account…':'Finding a free sub-agent…',applied:[],failed:[]};
  s.log.push(entry);renderAll();scrollDown(true);
  const at=s.log.indexOf(entry),staged=Object.keys(s.staged);
  const pick=A.contextPaths(paths,goal,{staged,max:8});
  const fresh=async(handover)=>{
    const files=await loadFiles(s,pick);
    return claudeJob(A.workerPrompt({task:goal,repo:s.repo,branch:s.branch,files,memory:S.memory,single:true,handover,recap:handover?'':recap(s,at-1)}),
      {role,images,onEvent:follow(s,entry),...pickFor(role)});
  };
  try{
    let r;
    if(s.thread&&role==='worker'){
      // Follow-up in the same chat: only the message and the files as they are now.
      const files=await loadFiles(s,pick.filter(p=>staged.includes(p)||goal.includes(p.split('/').pop())),{budget:40000});
      try{
        r=await claudeJob(A.workerPrompt({task:goal,files,followUp:true}),{profile:s.thread.profile,fresh:false,moveOnLimit:false,images,onEvent:follow(s,entry),...pickFor(role)});
      }catch(e){
        if(e.limited)r=await fresh(await compressHandover(s,entry,at,e.account||s.thread.account));
        else if(/busy/i.test(e.message)){s.thread=null;r=await fresh('');}
        else throw e;
      }
    }else r=await fresh('');
    if(role==='worker'&&r.profile)s.thread={profile:r.profile,account:r.account};
    entry.text=r.text||'';entry.account=r.account||entry.account;entry.cost=r.cost||0;
    await applyReply(s,entry,entry.text,goal);
    entry.state=entry.failed.length?(entry.applied.length?'partial':'failed'):'done';
    entry.note='';
  }catch(e){entry.state='failed';entry.note=e.stopped?'Stopped.':e.message;}
  entry.tEnd=Date.now();updateEntry(s,entry);save(s);
}
/** The model and effort a job asks for: the boss settings for the manager, fixed sub-agent settings otherwise. */
function pickFor(role,task){
  if(role==='manager')return {model:fixed(bossModel()),effort:fixed(bossEffort())};
  return {model:task?.model&&subModel()==='Auto'?task.model:fixed(subModel()),effort:task?.effort&&subEffort()==='Auto'?task.effort:fixed(subEffort())};
}
/** What the boss may choose from when sub-agents are on Auto. Free accounts do not offer Opus. */
function bossChoices(){
  const T=team(),allPaid=T.ready.length&&T.ready.every(paid);
  const models=subModel()==='Auto'?A.MODELS.filter(m=>allPaid||!/opus/i.test(m)):[];
  const efforts=subEffort()==='Auto'?A.EFFORTS:[];
  return models.length||efforts.length?{models,efforts}:null;

/** Compresses the session with a free sub-agent and records the handover in the conversation. */
async function compressHandover(s,entry,at,from){
  entry.state='sending';entry.note=(from||'The container')+' reached its limit. Compressing the conversation for the next one…';updateEntry(s,entry);
  const prior=s.log.slice(0,at-1); // everything before this message; the message itself is sent with the handover
  let summary='';
  try{
    const r=await claudeJob(A.compressPrompt({transcript:A.transcript(prior),repo:s.repo,branch:s.branch,staged:Object.keys(s.staged)}),{role:'worker'});
    summary=A.stripEdits(r.text||'').trim();
  }catch(e){if(e.stopped)throw e;}
  // If compression itself failed, the recent conversation goes over as text: still far smaller than the whole chat.
  if(!summary)summary=A.transcript(prior,6000);
  const hand={k:'handover',from:from||'',summary,ts:Date.now()};
  s.log.splice(s.log.indexOf(entry),0,hand);s.thread=null;save(s);renderThread();
  entry.note='Continuing on the next container…';updateEntry(s,entry);
  return A.handoverText(summary,prior);

async function runTeam(s,goal,images){

  const maxTasks=Math.max(1,Math.min(T.ready.length,Math.max(parallel(),2),6));
  const run={k:'run',state:'planning',summary:'',answer:'',note:'',ts:Date.now(),
    manager:{state:'sending',account:T.manager?.name||'',note:'Opening your manager account…',text:''},tasks:[]};
  s.log.push(run);renderAll();scrollDown(true);
  setStatus('The manager is planning…',true);
  const keyFiles=await loadFiles(s,A.contextPaths(paths,goal,{staged:Object.keys(s.staged),max:3}),{limit:4000,budget:12000});
  let plan;
  try{
    const r=await claudeJob(A.managerPrompt({task:goal,repo:s.repo,branch:s.branch,paths,files:keyFiles,maxTasks,memory:S.memory,recap:recap(s,s.log.indexOf(run)-1).slice(-3000),pick:bossChoices()}),
      {role:'manager',images,onEvent:follow(s,run.manager),...pickFor('manager')});
    run.manager.text=r.text||'';run.manager.account=r.account||run.manager.account;run.manager.cost=r.cost||0;run.manager.state='done';run.manager.note='';
    plan=A.parsePlan(run.manager.text,maxTasks);
  }catch(e){run.manager.state='failed';run.manager.note=e.message;run.state='failed';run.tEnd=Date.now();updateEntry(s,run);if(e.stopped)throw e;
    run.note='The manager could not plan, so one sub-agent takes the whole request.';updateEntry(s,run);
    return runSingle(s,goal,[],'worker');}
  if(!plan){run.state='done';run.tEnd=Date.now();run.note='The plan could not be read, so one sub-agent takes the whole request.';updateEntry(s,run);return runSingle(s,goal,[],'worker');}
  run.summary=plan.summary;
  if(!plan.tasks.length){run.answer=plan.answer||'No code change is needed.';run.state='done';run.tEnd=Date.now();run.closed=true;updateEntry(s,run);save(s);return;}
  run.tasks=plan.tasks.map((t,i)=>({...t,n:i+1,state:'queued',account:'',note:'',text:'',applied:[],failed:[]}));
  run.state='working';updateEntry(s,run);save(s);
  if(plan.summary)s.pendingMessage=short(plan.summary,72);
  let finished=0;
  setStatus('0 of '+run.tasks.length+' tasks done',true);
  await A.pool(run.tasks,parallel(),async task=>{
    if(S.stop){task.state='failed';task.note='Stopped before it started.';updateEntry(s,run);return;}
    task.state='sending';task.note='Finding a free sub-agent…';updateEntry(s,run);
    try{
      const extra=A.contextPaths(paths,task.instructions,{max:2}).filter(p=>!task.files.includes(p));
      const files=await loadFiles(s,[...task.files,...extra]);
      const r=await claudeJob(A.workerPrompt({task:task.instructions,goal,repo:s.repo,branch:s.branch,files,memory:S.memory}),
        {role:'worker',onEvent:p=>{follow(s,task)(p);updateEntry(s,run);},...pickFor('worker',task)});
      task.text=r.text||'';task.account=r.account||task.account;task.cost=r.cost||0;
      await applyReply(s,task,task.text,task.instructions,()=>updateEntry(s,run));
      task.state=task.failed.length?(task.applied.length?'partial':'failed'):'done';task.note='';
    }catch(e){task.state='failed';task.note=e.stopped?'Stopped.':e.message;}
    finished++;setStatus(finished+' of '+run.tasks.length+' tasks done',finished<run.tasks.length);
    updateEntry(s,run);save(s);renderDock();
  });
  run.state=run.tasks.every(t=>t.state==='done')?'done':run.tasks.some(t=>t.applied.length)?'partial':'failed';
  run.tEnd=Date.now();run.closed=true;updateEntry(s,run);save(s);
}
/** Applies a reply's edit blocks to the session. Edits whose OLD text does not match go back to a sub-agent once. */
async function applyReply(s,entry,text,goal,onChange,depth=0){
  const edits=A.parseEdits(text);
  if(!edits.length)return;
  const texts={};
  for(const p of new Set(edits.map(e=>e.path)))texts[p]=await currentText(p,s).catch(()=>null);
  const res=A.applyEdits(edits,texts);
  for(const p of new Set(res.applied.map(e=>e.path)))await stage(p,res.texts[p],s);
  entry.applied=[...new Set([...(entry.applied||[]),...res.applied.map(e=>e.path)])];
  entry.failed=res.failed.map(f=>({path:f.edit.path,reason:f.reason}));
  save(s);renderDock();onChange?.();updateEntry(s,entry);
  if(!res.failed.length||depth>0||S.stop)return;
  entry.note='Fixing '+res.failed.length+' edit'+(res.failed.length>1?'s':'')+' that did not match…';onChange?.();updateEntry(s,entry);
  const files=await loadFiles(s,[...new Set(res.failed.map(f=>f.edit.path))],{limit:60000,budget:160000});
  try{
    const r=await claudeJob(A.repairPrompt({goal,failed:res.failed,files,repo:s.repo,branch:s.branch}),{role:team().ready.length?'worker':'manager'});
    await applyReply(s,entry,r.text||'',goal,onChange,depth+1);
  }catch(e){if(e.stopped)throw e;}
  entry.note='';
}

async function fixDraft(style){
  closeSheet();
  if(!inApp()){toast('The prompt fixer runs on your Claude containers in the iPhone app.');return;}
  const draft=$('task').value.trim();if(!draft)return;
  const btn=$('fixBtn');btn.classList.add('busy');btn.disabled=true;
  try{
    const r=await claudeJob(A.fixPrompt(draft,style),{role:team().ready.length?'worker':'manager'});
    const fixed=A.parseFixed(r.text);
    if(!fixed)throw new Error('Claude returned nothing.');
    if($('task').value.trim()!==draft){toast('You changed the draft meanwhile, so it was kept.');return;}
    S.fixUndo=draft;$('task').value=fixed;ls('draft',fixed);autosize($('task'));renderSend();toast('Prompt fixed. Tap the wand to undo.');
  }catch(e){toast('Could not fix the prompt: '+e.message);}

}

// In the app iOS listens natively (web views cannot); in a browser the Web Speech API is used when present.
let rec=null,dictBase='';
function setMic(on){S.dictating=on;$('micBtn').classList.toggle('rec',on);$('micBtn').setAttribute('aria-pressed',on?'true':'false');}
window.onDictation=d=>{
  if(!S.dictating&&!d.final)return;
  if(d.text){$('task').value=dictBase+d.text;autosize($('task'));ls('draft',$('task').value);renderSend();}
  if(d.final)setMic(false);
};
async function toggleMic(){
  const box=$('task');
  if(S.dictating){if(inApp())native({op:'dictateStop'}).catch(()=>{});else rec?.stop();setMic(false);return;}
  dictBase=box.value?box.value.replace(/\s*$/,' '):'';
  if(inApp()){
    try{setMic(true);await native({op:'dictateStart',locale:navigator.language||'en-US'});toast('Listening…');}
    catch(e){setMic(false);toast(e.message||String(e));}
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice typing is not available in this browser. Use the keyboard mic.');box.focus();return;}
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;window.onDictation({text:t,final:false});};
  rec.onerror=e=>{if(e.error!=='aborted')toast('Mic: '+e.error);};
  rec.onend=()=>{rec=null;setMic(false);};
  rec.start();setMic(true);
}

/** "≈ 9k tokens · about 6% of a free session": what the message in the box will probably cost. */
function renderEstimate(){
  const el=$('footNote');if(!el)return;
  const text=$('task').value.trim();
  if(!text||!inApp()||!S.profiles.length){el.textContent='Claude is AI and can make mistakes.';return;}
  const hist=workerHist(),ctx=hist.length?hist.slice(-10).map(h=>h.in).sort((a,b)=>a-b)[Math.min(9,hist.length-1)>>1]:8000;

function ringTarget(){

function sessionPct(p){
  if(p.status==='Rate-Limited'&&p.limitedUntil>Date.now())return 100;

function renderUsageRing(){

/** Any file: photos are resized, readable text goes into the message, everything else (PDF, Word, Revit…) is attached in Claude. */
const TEXTLIKE=/\.(?:txt|md|markdown|csv|tsv|json|ya?ml|xml|html?|css|scss|js|cjs|mjs|jsx|ts|tsx|py|rb|go|rs|java|kt|swift|c|h|cpp|hpp|cs|php|sh|sql|toml|ini|cfg|log|env\.example)$/i;
async function addFiles(list){
  for(const f of [...list].slice(0,8)){
    try{
      if(/^image\/(?:jpeg|png|webp|gif|heic|heif)/.test(f.type)||/\.(?:heic|heif)$/i.test(f.name)){S.atts.push({name:f.name,image:true,mime:'image/jpeg',data:(await shrinkImage(f)).split(',')[1],thumb:URL.createObjectURL(f)});}
      else if((TEXTLIKE.test(f.name)||/^text\//.test(f.type))&&f.size<=400000)S.atts.push({name:f.name,text:await f.text()});
      else if(f.size<=10*1024*1024)S.atts.push({name:f.name,file:true,mime:f.type||'application/octet-stream',data:await fileBase64(f)});
      else toast(f.name+' is over 10 MB, too large to send to Claude.');
    }catch{toast('Could not read '+f.name);}
  }
  renderAtts();renderSend();
}
function fileBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f);});}
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));};img.onerror=rej;img.src=url;});}
function renderAtts(){
  const el=$('atts');el.hidden=!S.atts.length;renderEstimate();
  el.innerHTML=S.atts.map((a,i)=>'<span class="att-chip">'+(a.thumb?'<img alt="" src="'+esc(a.thumb)+'">':'')+'<span>'+esc(a.name)+'</span><button onclick="S.atts.splice('+i+',1);renderAtts()" aria-label="Remove">'+icon('x')+'</button></span>').join('');
}

    '<div class="group"><h3>Workspace</h3><div class="list">'+
      row('Claude team',teamMode()==='team'?'Manager plans · '+parallel()+' sub-agents at once':'Single sub-agent',icon('chev','ic chev'),'openTeam()')+
      row('Commit finished tasks automatically','Only when every edit applied. Otherwise you review first.',toggle('autoCommit',autoCommit(),"ls('auto_commit',this.checked?'1':'0')"))+
      '<div class="row"><span class="grow"><b>Your name</b><small>For the greeting.</small></span><input type="text" style="max-width:45%" value="'+esc(ls('my_name')||'')+'" placeholder="Optional" onchange="ls(\'my_name\',this.value.trim());renderThread()"></div>'+
    '</div></div>'+
    '<div class="group"><h3>Shared memory</h3><div class="list"><div class="row" style="flex-direction:column;align-items:stretch"><textarea id="memoryBox" maxlength="4000" placeholder="Facts and preferences every Claude account should know, like your stack or style." oninput="saveMemory(this.value)">'+esc(S.memory)+'</textarea><small id="memoryHint" style="color:var(--text-4)">'+S.memory.length+' / 4000 · stays on this device, never committed</small></div></div></div>'+
    '<div class="group"><h3>Appearance</h3><div class="list">'+row('Theme','',seg([['system','Auto'],['light','Light'],['dark','Dark']],theme,'setTheme'))+'</div></div>'+
    '<div class="group"><h3>App</h3><div class="list">'+
      row('App updates','Get new screens without reinstalling',icon('chev','ic chev'),'openAppUpdates()')+
      row('Clear sessions on this device','Removes conversations and unsaved edits. GitHub is not touched.','<button class="btn small danger" onclick="clearSessions()">Clear</button>')+
    '</div><p class="hint">AI Studio uses your own Claude accounts on claude.ai and your GitHub token. Nothing goes to any other server.</p></div>',null,'settings');
}
window.openSettings=openSettings;
function setTheme(v){ls('studio_theme',v);applyTheme();openSettings();}
function applyTheme(){const v=ls('studio_theme')||'system';if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);}
async function clearSessions(){
  if(!confirm('Delete every session and unsaved edit on this device?'))return;
  for(const id of Object.keys(S.sessions))await deleteSession(id);
  closeSheet();toast('Sessions cleared');
}

/* ===================== SHARED MEMORY ===================== */
// One memory for every account. In the app it lives in a device file the Claude tab uses too; it is never committed.
const MEMORY_MAX=4000;
let memoryTimer=0;
function saveMemory(v){
  S.memory=String(v||'').slice(0,MEMORY_MAX);ls('studio_memory',S.memory);
  const h=$('memoryHint');if(h)h.textContent=S.memory.length+' / 4000 · stays on this device, never committed';
  clearTimeout(memoryTimer);memoryTimer=setTimeout(()=>{if(inApp())native({op:'memorySet',text:S.memory.trim()}).catch(()=>{});},400);
}
async function syncMemoryFromNative(){
  if(!inApp())return;
  try{
    const remote=String((await native({op:'memoryGet'}))||'').trim(),local=(ls('studio_memory')||'').trim();
    if(!remote&&local)native({op:'memorySet',text:local}).catch(()=>{});
    else if(remote!==local){S.memory=remote;ls('studio_memory',remote);}
  }catch{}
}
window.syncMemoryFromNative=syncMemoryFromNative;

/* ===================== APP UPDATES (web layer, no new IPA) ===================== */
// The page never downloads code itself: the app checks GitHub, verifies the file and loads it.
function appUpdatesSheet(s,note){
  const running=s.running||0,built=s.builtIn||0,pending=!!s.installed&&s.installed!==s.running;
  const r=(t,d)=>'<div class="row"><span class="grow"><b>'+t+'</b><small>'+d+'</small></span></div>';
  let rows=r('Running v'+running,(running>built?'Downloaded update':'Built into this app')+' · built-in v'+built);
  if(pending)rows+=r('v'+s.installed+' is downloaded','Restart to apply it. Sessions and settings stay on this phone.');
  if(s.available&&s.needsNewApp)rows+=r('v'+s.available+' needs a new IPA','It uses native features this build doesn’t have. Install the latest IPA once.');
  else if(s.canInstall)rows+=r('v'+s.available+' is available','Downloads the new screens. No re-signing.');
  else if(s.available)rows+=r('Up to date','Latest published web version is v'+s.available+'.');
  const main=pending?'<button class="btn primary" onclick="appUpdateReload()">Restart to apply</button>'
    :s.canInstall?'<button class="btn primary" onclick="appUpdateInstall()">Download v'+s.available+'</button>'
    :'<button class="btn primary" onclick="appUpdateCheck()">Check for updates</button>';
  const reset=(running>built||s.installed)?'<button class="btn danger" onclick="appUpdateReset()">Reset to built-in</button>':'';
  return '<div class="group"><p class="hint" style="margin-top:0">Updates the workspace screens without reinstalling the IPA. Changes to the native app (tabs, Claude containers, sign-in) still need a new IPA.</p></div>'+
    '<div class="group"><div class="list">'+rows+'</div>'+(note?'<p class="hint">'+esc(note)+'</p>':'')+'</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end">'+reset+main+'</div>';
}
let _appUpd={};
function appUpdShow(note){showSheet('App updates',appUpdatesSheet(_appUpd,note||''),null,'updates');}
async function openAppUpdates(){
  if(!inApp()){showSheet('App updates','<p class="hint">In-app updates are available in the iPhone app. A browser loads the newest version when you reload.</p>');return;}
  try{_appUpd=(await native({op:'studioUpdateStatus'}))||{};}catch(e){_appUpd={};}
  appUpdShow('');
}
async function appUpdateCheck(){
  appUpdShow('Checking…');
  try{_appUpd=(await native({op:'studioUpdateCheck'}))||_appUpd;appUpdShow(_appUpd.canInstall||_appUpd.needsNewApp?'':'You have the latest version.');}
  catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateInstall(){
  appUpdShow('Downloading and verifying…');
  try{_appUpd=(await native({op:'studioUpdateInstall'}))||_appUpd;appUpdShow('Downloaded and verified.');}
  catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateReload(){
  if(!confirm('Restart now to apply the update? Sessions and settings stay on this phone.'))return;
  try{await native({op:'studioUpdateReload'});}catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateReset(){
  if(!confirm('Go back to the version built into this app?'))return;
  try{await native({op:'studioUpdateReset'});}catch(e){appUpdShow((e&&e.message)||String(e));}
}
/* end app updates */

/* ===================== START ===================== */
async function init(){
  applyTheme();
  document.body.classList.toggle('in-app',inApp());
  $('sbSpark').innerHTML=spark();drawIcons();
  S.token=ls('gh_token')||'';S.user=lsj('gh_user');S.memory=ls('studio_memory')||'';S.ask=ls('ask_mode')==='1';
  await loadSessions();
  const last=ls('cur_session');
  if(last&&S.sessions[last])S.cur=last;else newSession(false);
  const s=sess();if(s&&!s.repo&&ls('repo')){s.repo=ls('repo');s.branch=ls('branch')||'';}
  const draft=ls('draft');if(draft){$('task').value=draft;autosize($('task'));}
  renderAll();scrollDown(true);
  window.studioInitialized=true;
  if(window.STUDIO_REQUEST_TAB==='settings')openSettings();
  syncMemoryFromNative();refreshProfiles();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshProfiles();});
  if(S.token&&!S.user)gh.gh('/user').then(u=>{S.user=u;ls('gh_user',JSON.stringify({login:u.login,avatar:u.avatar_url}));renderSidebar();}).catch(()=>{});
}
bootGitHubCredential().catch(e=>toast('GitHub secure sign-in is unavailable: '+e.message)).then(init);
</script>
