<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>AI Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<body>
<div class="app">
  <div class="scrim" onclick="drawer(false)"></div>
  <aside class="sidebar" id="sidebar" aria-label="Sessions">
    <div class="sb-head">
      <span id="sbSpark"></span><span class="brand">AI Studio</span>
      <button class="icon-btn only-mobile" onclick="drawer(false)" aria-label="Close menu" data-icon="x"></button>
    </div>
    <button class="sb-new" onclick="newSession()"><span class="plus" data-icon="plus"></span>New session</button>
    <button class="sb-link" onclick="openTeam()"><span data-icon="team"></span>Claude team<small id="sbTeam"></small></button>
    <button class="sb-link" onclick="openRepoPicker()"><span data-icon="repo"></span>Repositories<small id="sbRepo"></small></button>
    <div class="sb-label">Recents</div>
    <div class="sb-list" id="sessionList"></div>
    <div class="sb-foot">
      <button class="me" onclick="openSettings()"><span class="avatar" id="meAvatar">A</span><span class="grow"><b id="meName">Settings</b><small id="meSub">GitHub, team and memory</small></span><span data-icon="gear"></span></button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn only-mobile" onclick="drawer(true)" aria-label="Open menu" data-icon="menu"></button>
      <button class="top-title" id="topTitle" onclick="openRepoPicker()"><span id="topText">AI Studio</span><span data-icon="down"></span></button>
      <button class="icon-btn" onclick="newSession()" aria-label="New session" data-icon="pen"></button>
    </header>
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
    <div class="dock">
      <div class="dock-inner">
        <div class="status" id="status" hidden></div>
        <div class="changes" id="changes" hidden></div>
        <div class="composer" id="composer">
          <div class="atts" id="atts" hidden></div>
          <textarea id="task" rows="1" placeholder="Describe a task or ask a question" aria-label="Task" oninput="autosize(this);ls('draft',this.value)" onkeydown="composerKey(event)"></textarea>
          <div class="composer-row">
            <button class="tool" onclick="pickFiles()" aria-label="Add photos or files" data-icon="plus"></button>
            <button class="tool" id="repoChip" onclick="openRepoPicker()"><span data-icon="repo"></span><span id="repoChipText">Choose repository</span></button>
            <button class="tool" id="teamChip" onclick="openTeam()"><span data-icon="team"></span><span id="teamChipText">Team</span></button>
            <span class="grow"></span>
            <button class="send" id="send" onclick="sendOrStop()" aria-label="Send" data-icon="up"></button>
          </div>
          <input type="file" id="fileInput" multiple hidden accept="image/*,.txt,.md,.json,.js,.ts,.tsx,.jsx,.html,.css,.swift,.py,.yml,.yaml,.csv,.xml,.sh" onchange="addFiles(this.files);this.value=''">
        </div>
        <div class="disclaimer">Claude can make mistakes. Review changes before you commit.</div>
      </div>
    </div>
  </main>
</div>
<div class="sheet-wrap" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" onclick="closeSheet()" aria-label="Close" data-icon="x"></button></div><div class="sheet-body" id="sheetBody"></div></div></div>

<script>
'use strict';
/* ===================== BASICS ===================== */
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function inApp(){try{return !!window.webkit?.messageHandlers?.native;}catch{return false;}}
function native(o){return window.webkit.messageHandlers.native.postMessage(o);}
let secureGitHubToken='';
function ls(k,v){try{
  if(k==='gh_token'&&inApp()){
    if(v===undefined)return secureGitHubToken;
    secureGitHubToken=v||'';
    native({op:'credentialSet',name:'github',value:secureGitHubToken}).catch(e=>toast('Could not save GitHub sign-in: '+e.message));return;
  }
  if(v===undefined)return localStorage.getItem(k);
  if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
}catch{return null;}}
function lsj(k){try{return JSON.parse(ls(k));}catch{return null;}}
async function bootGitHubCredential(){
  if(!inApp())return;
  const legacy=localStorage.getItem('gh_token');
  if(legacy){await native({op:'credentialSet',name:'github',value:legacy});localStorage.removeItem('gh_token');}
  secureGitHubToken=await native({op:'credentialGet',name:'github'})||'';
}
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function autosize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,innerHeight*.38)+'px';}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function short(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';}

/* Line icons, drawn once. */
const ICONS={
  menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
  pen:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',down:'<path d="M7 10l5 5 5-5"/>',
  repo:'<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 8.2v7.6M18 10.2c0 4-6 3-11 6"/>',
  team:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.4-.2 4.2 1.4 4.7 4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',alert:'<path d="M12 4 21 20H3z"/><path d="M12 10v4m0 3h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
  dot:'<circle cx="12" cy="12" r="3.5"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  out:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',commit:'<circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5m7 0H21"/>',star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  bug:'<rect x="7" y="8" width="10" height="12" rx="5"/><path d="M12 8v12M7 13H3m18 0h-4M8 5l2 3m6-3-2 3M4 8l3 2m13-2-3 2M4 19l3-2m13 2-3-2"/>',
  wand:'<path d="M4 20 16 8M14 4v2m4 0h2m-3-3-1 1m-8 0v2M6 4H4m14 10v2m2 0h-2"/>',book:'<path d="M5 4h9a4 4 0 0 1 4 4v12H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>'
};
function icon(name,cls='ic'){return '<svg class="'+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';}
/* The terracotta spark: twelve tapered rays. */
function spark(){
  let d='';
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6+(k%2?0.08:0),r=k%2?8.6:11,w=k%2?0.95:1.25;
    const x=Math.cos(a),y=Math.sin(a),px=-y*w,py=x*w,f=n=>n.toFixed(2);
    d+='M'+f(12+px)+' '+f(12+py)+'L'+f(12+x*r)+' '+f(12+y*r)+'L'+f(12-px)+' '+f(12-py)+'Z';
  }
  return '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/></svg>';
}
function drawIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{if(!el.dataset.drawn){el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon));el.dataset.drawn='1';}});}

/* Markdown, the subset Claude uses. Code blocks are escaped and highlighted after render. */
function md(text){
  const blocks=[];
  let o=String(text||'').replace(/\r/g,'').replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g,(_,lang,code)=>{
    blocks.push('<div class="codeblock"><header><span>'+esc(lang||'code')+'</span><button onclick="copyCode(this)">Copy</button></header><pre><code class="language-'+esc(lang||'plaintext')+'">'+esc(code.replace(/\n$/,''))+'</code></pre></div>');
    return '\n\u0000'+(blocks.length-1)+'\u0000\n';
  });
  o=esc(o);
  o=o.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^---+$/gm,'<hr>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  o=o.replace(/(?:^[ \t]*[-*+] .+(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*[-*+] /,'')+'</li>').join('')+'</ul>\n');
  o=o.replace(/(?:^[ \t]*\d+[.)] .+(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*\d+[.)] /,'')+'</li>').join('')+'</ol>\n');
  o=o.split(/\n{2,}/).map(p=>{p=p.trim();if(!p)return '';if(/^(<(h\d|ul|ol|blockquote|hr)|\u0000)/.test(p))return p;return '<p>'+p.replace(/\n/g,'<br>')+'</p>';}).join('');
  return o.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[+i]);
}
function highlight(root){if(typeof hljs==='undefined')return;root.querySelectorAll('.codeblock code:not([data-hl])').forEach(el=>{try{hljs.highlightElement(el);}catch{}el.dataset.hl='1';});}
function copyCode(btn){const code=btn.closest('.codeblock').querySelector('code').textContent;navigator.clipboard?.writeText(code).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1600);}).catch(()=>toast('Copy failed'));}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied')).catch(()=>toast('Copy failed'));}

/* ===================== STATE ===================== */
const A=window.StudioAgents;
const S={token:'',user:null,repos:[],paths:{},files:{},sessions:{},cur:null,profiles:[],busy:false,stop:false,atts:[],memory:''};
const gh=makeGitHub(()=>S.token);
function sess(){return S.sessions[S.cur]||null;}
function teamMode(){return ls('team_mode')||'team';}
function parallel(){return Math.max(1,Math.min(6,Number(ls('team_parallel'))||3));}
function autoCommit(){return ls('auto_commit')==='1';}

/* Sessions live in IndexedDB on this device: the conversation, staged edits and the commit they started from. */
let dbPromise,dbHandle=null;
function db(){
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open('ai-studio-sessions',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('sessions',{keyPath:'id'});
    r.onsuccess=()=>{dbHandle=r.result;resolve(r.result);};r.onerror=()=>reject(r.error);
  });
  return dbPromise;
}
async function loadSessions(){
  try{
    const d=await db();
    const all=await new Promise((res,rej)=>{const q=d.transaction('sessions').objectStore('sessions').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
    for(const s of all){
      // A task that was running when the app closed cannot resume; say so instead of spinning forever.
      for(const e of s.log||[])if(['working','planning','sending','awaiting','queued','streaming'].includes(e.state)){e.state='failed';e.note='Interrupted when the app closed. Send again to retry.';(e.tasks||[]).forEach(t=>{if(!['done','failed','partial'].includes(t.state)){t.state='failed';t.note='Interrupted';}});}
      S.sessions[s.id]=s;
    }
  }catch{}
}
const saveTimers={};
// Written synchronously once the database is open, so a save started as the app closes still lands.
async function writeSession(s){
  try{const d=dbHandle||await db();d.transaction('sessions','readwrite').objectStore('sessions').put(JSON.parse(JSON.stringify(s)));}catch{toast('Could not save this session on the device.');}
}
/** Writes at once, then at most every 300 ms while a task streams; later changes never postpone a write. */
const lastWrite={};
function save(s=sess()){
  if(!s)return;
  s.ts=Date.now();
  if(saveTimers[s.id])return;
  const wait=300-(Date.now()-(lastWrite[s.id]||0));
  const run=()=>{delete saveTimers[s.id];lastWrite[s.id]=Date.now();writeSession(s);};
  if(wait<=0)run();else saveTimers[s.id]=setTimeout(run,wait);
}
/** Writes pending saves now: the app can be closed or reloaded at any moment. */
function flushSaves(){for(const id of Object.keys(saveTimers)){clearTimeout(saveTimers[id]);delete saveTimers[id];if(S.sessions[id])writeSession(S.sessions[id]);}}
addEventListener('pagehide',flushSaves);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSaves();});
async function deleteSession(id){
  delete S.sessions[id];
  try{const d=await db();d.transaction('sessions','readwrite').objectStore('sessions').delete(id);}catch{}
  if(S.cur===id){S.cur=null;ls('cur_session',null);}
  renderAll();
}
function newSession(open=true){
  if(S.busy){toast('Wait for the current task, or stop it.');return null;}
  const repo=ls('repo')||'',branch=ls('branch')||'';
  const cur=sess();
  // An untouched session is reused instead of piling up empty ones.
  if(cur&&!cur.log.length&&!Object.keys(cur.staged).length&&cur.repo===repo&&cur.branch===branch){if(open){drawer(false);$('task').focus();}return cur;}
  const s={id:uid('s'),title:'',repo,branch,ts:Date.now(),log:[],staged:{},orig:{},baseSHA:null};
  S.sessions[s.id]=s;S.cur=s.id;ls('cur_session',s.id);
  if(open){drawer(false);renderAll();}
  return s;
}
function openSession(id){
  if(S.busy&&id!==S.cur){toast('Wait for the current task, or stop it.');return;}
  const s=S.sessions[id];if(!s)return;
  S.cur=id;ls('cur_session',id);
  if(s.repo){ls('repo',s.repo);ls('branch',s.branch);}
  drawer(false);renderAll();
}

/* ===================== GITHUB ===================== */
async function connectToken(){
  const tok=($('ghTokenInput')?.value||'').trim();if(!tok){toast('Paste a token first');return;}
  try{
    const user=await makeGitHub(()=>tok).gh('/user');
    S.token=tok;ls('gh_token',tok);S.user=user;ls('gh_user',JSON.stringify({login:user.login,avatar:user.avatar_url}));
    toast('Connected as '+user.login);S.repos=[];
    if($('sheet').dataset.kind==='settings')openSettings();
    renderAll();loadRepos().catch(()=>{});
  }catch(e){toast(e.message);}
}
function disconnectGitHub(){
  if(!confirm('Disconnect GitHub on this device?'))return;
  S.token='';ls('gh_token',null);S.user=null;ls('gh_user',null);S.repos=[];renderAll();openSettings();
}
let signInCancel=false;
async function deviceSignIn(){
  const cid=ls('gh_client_id');
  if(!cid){toast('Add your GitHub OAuth Client ID first.');return;}
  if(!inApp()){toast('Device sign-in works in the iPhone app. Use a token here.');return;}
  try{
    const r=JSON.parse(await native({op:'githubDeviceCode',clientId:cid}));
    if(!r.device_code)throw new Error(r.error_description||r.error||'GitHub refused. Is Device Flow enabled on the OAuth app?');
    navigator.clipboard?.writeText(r.user_code).catch(()=>{});
    signInCancel=false;
    showSheet('Sign in to GitHub','<div class="group"><p class="hint">Enter this code on GitHub. It is already copied.</p><div class="code-big">'+esc(r.user_code)+'</div></div><button class="btn accent" onclick="window.open(\''+esc(r.verification_uri)+'\',\'_blank\')">Open GitHub</button><p class="hint" style="text-align:center">Waiting for you to approve…</p>',()=>{signInCancel=true;});
    let wait=(r.interval||5)*1000;
    while(!signInCancel){
      await new Promise(res=>setTimeout(res,wait));
      const t=JSON.parse(await native({op:'githubToken',clientId:cid,deviceCode:r.device_code}));
      if(t.access_token){S.token=t.access_token;ls('gh_token',S.token);S.user=await gh.gh('/user');ls('gh_user',JSON.stringify({login:S.user.login,avatar:S.user.avatar_url}));toast('Connected as '+S.user.login);openSettings();renderAll();return;}
      if(t.error==='slow_down')wait+=5000;else if(t.error!=='authorization_pending')throw new Error(t.error_description||t.error);
    }
  }catch(e){toast('GitHub sign-in failed: '+(e.message||e));}
}
let reposLoading=null;
async function loadRepos(){
  if(!S.token)return [];
  if(!S.repos.length){
    reposLoading=reposLoading||gh.gh('/user/repos?per_page=100&sort=updated&affiliation=owner,collaborator,organization_member').finally(()=>{reposLoading=null;});
    S.repos=await reposLoading;
  }
  return S.repos;
}
/** The pinned commit and file list for the open session. A new session starts from the branch's latest commit. */
async function ensureBase(s=sess()){
  if(!S.token)throw new Error('Connect GitHub in Settings first.');
  if(!s.repo||!s.branch)throw new Error('Choose a repository and branch first.');
  if(!s.baseSHA){s.baseSHA=await gh.headSHA(s.repo,s.branch);save(s);}
  const key=s.repo+'@'+s.baseSHA;
  if(!S.paths[key])S.paths[key]=await gh.listFiles(s.repo,s.baseSHA);
  return [...new Set([...S.paths[key],...Object.keys(s.staged)])];
}
/** A file as this session sees it: its staged edit, or the version at the pinned commit (null when it does not exist). */
async function currentText(path,s=sess()){
  if(path in s.staged)return s.staged[path];
  const key=s.repo+'@'+s.baseSHA+':'+path;
  if(!(key in S.files))S.files[key]=await gh.readFile(s.repo,path,s.baseSHA);
  return S.files[key];
}
async function stage(path,text,s=sess()){
  if(!(path in s.orig)){const key=s.repo+'@'+s.baseSHA+':'+path;s.orig[path]=(key in S.files?S.files[key]:await gh.readFile(s.repo,path,s.baseSHA))??'';}
  if(text===s.orig[path]){delete s.staged[path];delete s.orig[path];}else s.staged[path]=text;
}
function localSecrets(){
  const out=[S.token];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/token|key|secret/i.test(k))out.push(localStorage.getItem(k));}
  return out.filter(v=>typeof v==='string'&&v.length>=8);
}
async function commitSession({automatic=false,message}={}){
  const s=sess();if(!s||S.committing)return;
  const files=Object.keys(s.staged);if(!files.length)return;
  if(!automatic&&!confirm('Commit '+files.length+' file'+(files.length>1?'s':'')+' to '+s.repo+' · '+s.branch+'?'))return;
  S.committing=true;renderDock();
  const msg=(message||s.commitMessage||'').trim()||'Update '+files.slice(0,3).map(f=>f.split('/').pop()).join(', ')+(files.length>3?' and more':'');
  try{
    const users=s.log.filter(e=>e.k==='user').map(e=>({role:'user',content:e.text}));
    assertRepoPublishable({...s.staged,'commit-message.txt':msg},{secrets:localSecrets(),messages:users});
    const sha=await gh.commit({repo:s.repo,branch:s.branch,files:s.staged,orig:s.orig,baseSHA:s.baseSHA,message:msg});
    s.log.push({k:'commit',sha,repo:s.repo,branch:s.branch,files,ts:Date.now()});
    s.staged={};s.orig={};s.baseSHA=sha;s.commitMessage='';delete s.pendingMessage;
    closeSheet();toast('Committed '+sha.slice(0,7));
  }catch(e){s.log.push({k:'note',tone:'err',text:'Commit failed: '+e.message});}
  finally{S.committing=false;save(s);renderAll();}
}

async function refreshProfiles(){
  if(!inApp()){S.profiles=[];renderTeamBits();return;}
  try{S.profiles=(await native({op:'claudeProfiles'}))||[];}catch{S.profiles=[];}
  renderTeamBits();

let profileTimer=0;
window.onClaudeProfiles=()=>{clearTimeout(profileTimer);profileTimer=setTimeout(refreshProfiles,250);};
function team(){
  const P=S.profiles;
  return {all:P,manager:P.find(p=>p.manager)||null,managerReady:P.some(p=>p.manager&&p.ready),
    workers:P.filter(p=>!p.manager),ready:P.filter(p=>!p.manager&&p.ready)};
}
const jobs={};
/** One message to one container. Resolves with Claude's finished reply; events stream into onEvent. */
function claudeJob(text,{role='worker',fresh=true,profile,images=[],onEvent}={}){
  const id=uid('j');
  return new Promise((resolve,reject)=>{
    jobs[id]={onEvent,resolve,reject};
    native({op:'claudeSend',id,text,role,fresh,images,...(profile?{profile}:{})})
      .then(r=>{if(jobs[id])onEvent?.({id,state:'sending',account:r?.account||'',profile:r?.profile||'',note:''});})
      .catch(e=>{if(!jobs[id])return;delete jobs[id];reject(new Error(e?.message||String(e)));});
  });
}
window.onClaudeStream=p=>{
  const j=p&&jobs[p.id];if(!j)return;
  try{j.onEvent?.(p);}catch{}
  if(p.state==='done'){delete jobs[p.id];j.resolve(p);}
  else if(p.state==='failed'||p.state==='stopped'){delete jobs[p.id];j.reject(Object.assign(new Error(p.note||'Claude did not answer.'),{stopped:p.state==='stopped'}));}
};
function openClaude(profile){if(inApp())native({op:'openClaude',...(profile?{profile}:{})}).catch(()=>{});else toast('Your Claude containers live in the AI Studio iPhone app.');}
async function setManager(id){

}

/* ===================== RUNNING A TASK ===================== */
function sendOrStop(){if(S.busy)stopAll();else sendTask();}
function composerKey(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(min-width:821px)').matches){e.preventDefault();sendOrStop();}}
function stopAll(){
  S.stop=true;setStatus('Stopping…',true);
  if(inApp())native({op:'claudeStop'}).catch(()=>{});
  for(const id of Object.keys(jobs)){const j=jobs[id];delete jobs[id];j.reject(Object.assign(new Error('Stopped.'),{stopped:true}));}
}
async function sendTask(){
  const text=$('task').value.trim();if(!text&&!S.atts.length)return;
  let s=sess();
  if(!s||s.repo!==(ls('repo')||'')||s.branch!==(ls('branch')||''))s=newSession(false);
  if(!s.repo){openRepoPicker();toast('Choose a repository first.');return;}
  if(!S.token){openSettings();toast('Connect GitHub first.');return;}
  const atts=S.atts;S.atts=[];renderAtts();
  const fileText=atts.filter(a=>!a.image).map(a=>'\n\n--- Attached file: '+a.name+' ---\n'+a.text).join('');
  const images=atts.filter(a=>a.image).slice(0,4).map(a=>({name:a.name,mime:a.mime,data:a.data}));
  $('task').value='';ls('draft','');autosize($('task'));
  if(!s.title)s.title=short(text||atts[0]?.name||'New session',60);
  s.log.push({k:'user',text,files:atts.map(a=>a.name),ts:Date.now()});
  save(s);renderAll();scrollDown(true);
  if(!inApp()){s.log.push({k:'note',tone:'err',text:'Your Claude containers run in the AI Studio iPhone app. Open this session there to send it.'});save(s);renderAll();return;}
  await refreshProfiles();
  const T=team();
  if(!T.all.length){s.log.push({k:'note',tone:'err',text:'Add your Claude accounts in the Claude tab first.',action:'claude'});save(s);renderAll();return;}
  if(!T.ready.length&&!T.managerReady){s.log.push({k:'note',tone:'err',text:'Every container is limited, paused or signed out. Check the Claude tab.',action:'claude'});save(s);renderAll();return;}
  S.busy=true;S.stop=false;renderDock();
  const goal=text+fileText,firstNew=s.log.length;
  try{
    await ensureBase(s);
    const useTeam=teamMode()==='team'&&T.managerReady&&T.ready.length>0&&!A.isQuickQuestion(text);
    if(useTeam)await runTeam(s,goal,images);
    else await runSingle(s,goal,images,T.ready.length?'worker':'manager');
  }catch(e){
    if(!e.stopped)s.log.push({k:'note',tone:'err',text:e.message||String(e)});
  }finally{
    S.busy=false;setStatus('');
    if(S.stop)s.log.push({k:'note',text:'Stopped. Edits that were already applied are kept.'});
    save(s);renderAll();
    // Automatic commits only when everything this task asked for went in cleanly.
    const fresh=s.log.slice(firstNew),clean=!fresh.some(e=>e.failed?.length||e.state==='failed'||e.state==='partial'||e.tasks?.some(t=>t.failed?.length||t.state!=='done'));
    if(!S.stop&&autoCommit()&&clean&&Object.keys(s.staged).length)await commitSession({automatic:true,message:s.pendingMessage});
  }
}
/** Live updates from a container into a log entry. */
function follow(s,entry){
  return p=>{
    if(p.account)entry.account=p.account;
    if(p.profile)entry.profile=p.profile;
    if(p.note!==undefined&&p.note!=='')entry.note=p.note;
    if(p.state==='streaming'&&p.text)entry.text=p.text;
    if(['queued','sending','awaiting','streaming','switching'].includes(p.state))entry.state=p.state==='switching'?'sending':p.state;
    if(p.state==='streaming')entry.note='';
    updateEntry(s,entry);
  };
}
// Sub-agents get whole files up to 40k characters and excerpts beyond; about 100k in total keeps free accounts going longer.
async function loadFiles(s,paths,{limit=40000,budget=100000}={}){
  const out=[];let used=0;
  for(const path of paths){
    const text=await currentText(path,s).catch(()=>null);
    const lim=Math.max(6000,Math.min(limit,budget-used));
    out.push({path,text,limit:lim});
    used+=Math.min(text?.length||0,lim);
    if(used>=budget)break;
  }
  return out;
}
async function runSingle(s,goal,images,role){
  const paths=await ensureBase(s);
  const entry={k:'reply',state:'sending',text:'',account:'',note:role==='manager'?'Opening your manager account…':'Finding a free sub-agent…',applied:[],failed:[]};
  s.log.push(entry);renderAll();scrollDown(true);
  setStatus('Claude is working…',true);
  const files=await loadFiles(s,A.contextPaths(paths,goal,{staged:Object.keys(s.staged),max:8}));
  const prompt=A.workerPrompt({task:goal,repo:s.repo,branch:s.branch,files,memory:S.memory,single:true});
  try{
    const r=await claudeJob(prompt,{role,images,onEvent:follow(s,entry)});
    entry.text=r.text||'';entry.account=r.account||entry.account;
    await applyReply(s,entry,entry.text,goal);
    entry.state=entry.failed.length?(entry.applied.length?'partial':'failed'):'done';
    entry.note='';
  }catch(e){entry.state='failed';entry.note=e.stopped?'Stopped.':e.message;}
  updateEntry(s,entry);save(s);
}
async function runTeam(s,goal,images){
  const paths=await ensureBase(s),T=team();
  const maxTasks=Math.max(1,Math.min(T.ready.length,Math.max(parallel(),2),6));
  const run={k:'run',state:'planning',summary:'',answer:'',note:'',ts:Date.now(),
    manager:{state:'sending',account:T.manager?.name||'',note:'Opening your manager account…',text:''},tasks:[]};
  s.log.push(run);renderAll();scrollDown(true);
  setStatus('The manager is planning…',true);
  const keyFiles=await loadFiles(s,A.contextPaths(paths,goal,{staged:Object.keys(s.staged),max:3}),{limit:4000,budget:12000});
  let plan;
  try{
    const r=await claudeJob(A.managerPrompt({task:goal,repo:s.repo,branch:s.branch,paths,files:keyFiles,maxTasks,memory:S.memory}),
      {role:'manager',images,onEvent:follow(s,run.manager)});
    run.manager.text=r.text||'';run.manager.account=r.account||run.manager.account;run.manager.state='done';run.manager.note='';
    plan=A.parsePlan(run.manager.text,maxTasks);
  }catch(e){run.manager.state='failed';run.manager.note=e.message;run.state='failed';updateEntry(s,run);if(e.stopped)throw e;
    run.note='The manager could not plan, so one sub-agent takes the whole request.';updateEntry(s,run);
    return runSingle(s,goal,[],'worker');}
  if(!plan){run.state='done';run.note='The plan could not be read, so one sub-agent takes the whole request.';updateEntry(s,run);return runSingle(s,goal,[],'worker');}
  run.summary=plan.summary;
  if(!plan.tasks.length){run.answer=plan.answer||'No code change is needed.';run.state='done';updateEntry(s,run);save(s);return;}
  run.tasks=plan.tasks.map((t,i)=>({...t,n:i+1,state:'queued',account:'',note:'',text:'',applied:[],failed:[]}));
  run.state='working';updateEntry(s,run);save(s);
  if(plan.summary)s.pendingMessage=short(plan.summary,72);
  let finished=0;
  setStatus('0 of '+run.tasks.length+' tasks done',true);
  await A.pool(run.tasks,parallel(),async task=>{
    if(S.stop){task.state='failed';task.note='Stopped before it started.';updateEntry(s,run);return;}
    task.state='sending';task.note='Finding a free sub-agent…';updateEntry(s,run);
    try{
      const extra=A.contextPaths(paths,task.instructions,{max:2}).filter(p=>!task.files.includes(p));
      const files=await loadFiles(s,[...task.files,...extra]);
      const r=await claudeJob(A.workerPrompt({task:task.instructions,goal,repo:s.repo,branch:s.branch,files,memory:S.memory}),
        {role:'worker',onEvent:p=>{follow(s,task)(p);updateEntry(s,run);}});
      task.text=r.text||'';task.account=r.account||task.account;
      await applyReply(s,task,task.text,task.instructions,()=>updateEntry(s,run));
      task.state=task.failed.length?(task.applied.length?'partial':'failed'):'done';task.note='';
    }catch(e){task.state='failed';task.note=e.stopped?'Stopped.':e.message;}
    finished++;setStatus(finished+' of '+run.tasks.length+' tasks done',finished<run.tasks.length);
    updateEntry(s,run);save(s);renderDock();
  });
  run.state=run.tasks.every(t=>t.state==='done')?'done':run.tasks.some(t=>t.applied.length)?'partial':'failed';
  updateEntry(s,run);save(s);
}
/** Applies a reply's edit blocks to the session. Edits whose OLD text does not match go back to a sub-agent once. */
async function applyReply(s,entry,text,goal,onChange,depth=0){
  const edits=A.parseEdits(text);
  if(!edits.length)return;
  const texts={};
  for(const p of new Set(edits.map(e=>e.path)))texts[p]=await currentText(p,s).catch(()=>null);
  const res=A.applyEdits(edits,texts);
  for(const p of new Set(res.applied.map(e=>e.path)))await stage(p,res.texts[p],s);
  entry.applied=[...new Set([...(entry.applied||[]),...res.applied.map(e=>e.path)])];
  entry.failed=res.failed.map(f=>({path:f.edit.path,reason:f.reason}));
  save(s);renderDock();onChange?.();updateEntry(s,entry);
  if(!res.failed.length||depth>0||S.stop)return;
  entry.note='Fixing '+res.failed.length+' edit'+(res.failed.length>1?'s':'')+' that did not match…';onChange?.();updateEntry(s,entry);
  const files=await loadFiles(s,[...new Set(res.failed.map(f=>f.edit.path))],{limit:60000,budget:160000});
  try{
    const r=await claudeJob(A.repairPrompt({goal,failed:res.failed,files,repo:s.repo,branch:s.branch}),{role:team().ready.length?'worker':'manager'});
    await applyReply(s,entry,r.text||'',goal,onChange,depth+1);
  }catch(e){if(e.stopped)throw e;}
  entry.note='';
}

async function addFiles(list){
  for(const f of [...list].slice(0,6)){
    try{
      if(/^image\//.test(f.type)){S.atts.push({name:f.name,image:true,mime:'image/jpeg',data:(await shrinkImage(f)).split(',')[1],thumb:URL.createObjectURL(f)});}
      else if(f.size<=400000)S.atts.push({name:f.name,text:await f.text()});
      else toast(f.name+' is too large to attach.');
    }catch{toast('Could not read '+f.name);}
  }
  renderAtts();
}
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));};img.onerror=rej;img.src=url;});}
function renderAtts(){
  const el=$('atts');el.hidden=!S.atts.length;
  el.innerHTML=S.atts.map((a,i)=>'<span class="att-chip">'+(a.thumb?'<img alt="" src="'+esc(a.thumb)+'">':'')+'<span>'+esc(a.name)+'</span><button onclick="S.atts.splice('+i+',1);renderAtts()" aria-label="Remove">'+icon('x')+'</button></span>').join('');
}

/* ===================== SHEETS ===================== */
let sheetClose=null;
function showSheet(title,html,onClose,kind=''){
  sheetClose=onClose||null;$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;
  $('sheet').dataset.kind=kind;$('sheet').classList.add('show');drawIcons($('sheetBody'));highlight($('sheetBody'));
}
function closeSheet(){$('sheet').classList.remove('show');$('sheet').dataset.kind='';const f=sheetClose;sheetClose=null;f?.();}
function drawer(open){document.body.classList.toggle('drawer',open);}
function row(title,sub,right='',click=''){return (click?'<button class="row" onclick="'+click+'">':'<div class="row">')+'<span class="grow"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span>'+right+(click?'</button>':'</div>');}
function toggle(id,on,change){return '<label class="switch"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+' onchange="'+change+'"><i></i></label>';}
function seg(values,current,fn){return '<div class="seg">'+values.map(([v,l])=>'<button class="'+(String(v)===String(current)?'on':'')+'" onclick="'+fn+'(\''+v+'\')">'+esc(l)+'</button>').join('')+'</div>';}

async function openRepoPicker(){
  drawer(false);
  if(!S.token){openSettings();toast('Connect GitHub first.');return;}
  showSheet('Repositories','<div class="row" style="padding:0"><input type="search" class="field" id="repoSearch" placeholder="Search your repositories" oninput="renderRepoList()"></div><div class="list" id="repoList"><div class="row"><span class="spin"></span><span class="grow">Loading…</span></div></div>',null,'repo');
  try{await loadRepos();renderRepoList();}catch(e){const el=$('repoList');if(el)el.innerHTML=row(esc(e.message),'');}
}
function renderRepoList(){
  if(!$('repoList'))return;
  const q=($('repoSearch')?.value||'').toLowerCase(),cur=ls('repo');
  const list=S.repos.filter(r=>r.full_name.toLowerCase().includes(q)).slice(0,60);
  $('repoList').innerHTML=list.length?list.map(r=>row(esc(r.full_name),(r.private?'Private':'Public')+' · default '+esc(r.default_branch)+(r.permissions&&!r.permissions.push?' · read-only':''),r.full_name===cur?icon('check'):icon('chev','ic chev'),'pickRepo(\''+esc(r.full_name)+'\')')).join(''):row('No repositories found','');
}
async function pickRepo(name){
  showSheet('Branch · '+name.split('/').pop(),'<div class="list" id="branchList"><div class="row"><span class="spin"></span><span class="grow">Loading branches…</span></div></div>',null,'branch');
  try{
    const branches=await gh.gh('/repos/'+name+'/branches?per_page=100');
    const def=S.repos.find(r=>r.full_name===name)?.default_branch;
    branches.sort((a,b)=>(b.name===def)-(a.name===def));
    if(!$('branchList'))return;
    $('branchList').innerHTML=branches.map(b=>row(esc(b.name),b.name===def?'Default branch':b.protected?'Protected':'',b.name===ls('branch')&&name===ls('repo')?icon('check'):icon('chev','ic chev'),'pickBranch(\''+esc(name)+'\',\''+esc(b.name)+'\')')).join('');
  }catch(e){const el=$('branchList');if(el)el.innerHTML=row(esc(e.message),'');}
}
function pickBranch(repo,branch){
  if(S.busy){toast('Wait for the current task, or stop it.');return;}
  ls('repo',repo);ls('branch',branch);closeSheet();
  const s=sess();
  if(s&&!s.log.length&&!Object.keys(s.staged).length){s.repo=repo;s.branch=branch;s.baseSHA=null;}
  else newSession(false);
  renderAll();toast(repo.split('/').pop()+' · '+branch);
}

function openTeam(){
  drawer(false);
  if(!inApp()){showSheet('Claude team','<div class="group"><div class="list">'+row('Containers run in the iPhone app','Each Claude account is its own container with its own sign-in. Open AI Studio on your iPhone to add accounts and run the team.')+'</div></div>',null,'team');return;}
  const T=team(),mode=teamMode();
  const status=p=>p.busy?'<span class="pill warn">Working</span>':!p.enabled?'<span class="pill">Paused</span>':p.status==='Active'?'<span class="pill ok">Ready</span>':p.status==='Rate-Limited'?'<span class="pill err">Limited</span>':'<span class="pill">Signed out</span>';
  const people=T.all.length?T.all.map(p=>row(esc(p.name)+(p.manager?' <span class="pill star">Manager</span>':''),p.manager?'Plans the work. You press Send in this account.':'Sub-agent · sends by itself',status(p),'openClaude(\''+p.id+'\')')).join(''):row('No accounts yet','Add your Claude accounts in the Claude tab and sign in to each.');
  showSheet('Claude team',
    '<div class="group"><h3>How tasks run</h3><div class="list">'+
      row('Mode',mode==='team'?'The manager splits the work; sub-agents edit in parallel.':'One sub-agent does the whole task.',seg([['team','Team'],['single','Single']],mode,'setTeamMode'))+
      row('Sub-agents at once','More is faster but uses more accounts at the same time.',seg([[1,'1'],[2,'2'],[3,'3'],[4,'4']],parallel(),'setParallel'))+
    '</div><p class="hint">Short questions skip the manager. If a sub-agent hits its limit, its task restarts on the next free one by itself.</p></div>'+
    '<div class="group"><h3>Containers · '+(T.ready.length+(T.managerReady?1:0))+' of '+T.all.length+' ready</h3><div class="list">'+people+'</div></div>'+
    '<div class="group"><h3>Manager</h3><div class="list">'+
      (T.workers.concat(T.manager?[T.manager]:[]).length?'<div class="row"><span class="grow"><b>Manager account</b><small>Use your Opus account. It only plans, so it uses little.</small></span><select class="field" style="width:auto;max-width:48%" onchange="setManager(this.value)"><option value="">None</option>'+T.all.map(p=>'<option value="'+esc(p.id)+'" '+(p.manager?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>':'')+
      row('Add or sign in to accounts','Opens the Claude tab',icon('out'),'openClaude()')+
    '</div></div>',null,'team');
}
function setTeamMode(v){ls('team_mode',v);renderTeamBits();openTeam();}
function setParallel(v){ls('team_parallel',String(v));openTeam();}

function openReview(commitFocus){
  const s=sess();if(!s)return;
  const files=Object.keys(s.staged);
  if(!files.length){closeSheet();return;}
  const diffHTML=p=>'<div class="diff">'+A.lineDiff(s.orig[p]??'',s.staged[p]).map(r=>r.t==='…'?'<div class="f">'+esc(r.s)+'</div>':'<div class="'+(r.t==='+'?'a':r.t==='-'?'d':'c')+'">'+esc(r.s)+'</div>').join('')+'</div>';
  const suggested=s.pendingMessage||'';
  showSheet('Review changes',
    '<div class="group"><h3>'+esc(s.repo)+' · '+esc(s.branch)+'</h3><div style="display:flex;flex-direction:column;gap:10px">'+files.map(p=>{const d=A.diffStats(s.orig[p]??'',s.staged[p]);
      return '<details class="file"'+(files.length===1?' open':'')+'><summary><span class="p">'+esc(p)+(s.orig[p]===''?' (new)':'')+'</span><span class="plus">+'+d.add+'</span><span class="minus">−'+d.del+'</span><button class="icon-btn" style="width:30px;height:30px" onclick="event.preventDefault();discardFile(\''+esc(p)+'\')" aria-label="Discard '+esc(p)+'">'+icon('trash')+'</button></summary>'+diffHTML(p)+'</details>';}).join('')+'</div></div>'+
    '<div class="group"><h3>Commit</h3><div class="list"><div class="row"><input type="text" id="commitMsg" placeholder="Commit message" value="'+esc(s.commitMessage||suggested)+'" oninput="sess().commitMessage=this.value"></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn danger" onclick="discardAll()">Discard all</button><span style="flex:1"></span><button class="btn primary" onclick="commitSession({message:$(\'commitMsg\').value})"'+(S.busy||S.committing?' disabled':'')+'>'+icon('commit')+'Commit &amp; push</button></div>'+
    '<p class="hint">Commits go straight to '+esc(s.branch)+' on GitHub. Nothing is force-pushed; if someone changed these files meanwhile, the commit stops and your edits stay.</p></div>',null,'review');
  if(commitFocus)setTimeout(()=>$('commitMsg')?.focus(),120);
}
function discardFile(p){const s=sess();if(!confirm('Discard the change to '+p+'?'))return;delete s.staged[p];delete s.orig[p];save(s);renderDock();renderSidebar();openReview();}
function discardAll(){const s=sess();if(!confirm('Discard every change in this session?'))return;s.staged={};s.orig={};save(s);renderAll();closeSheet();}

function openSettings(){
  drawer(false);
  const u=S.user||lsj('gh_user'),theme=ls('studio_theme')||'system';
  showSheet('Settings',
    '<div class="group"><h3>GitHub</h3><div class="list">'+
      (S.token?row('Connected'+(u?.login?' as '+esc(u.login):''),'Token stored '+(inApp()?'in the iOS Keychain':'in this browser'),'<button class="btn small danger" onclick="disconnectGitHub()">Disconnect</button>')
        :'<div class="row" style="flex-wrap:wrap"><span class="grow" style="min-width:100%"><b>Personal access token</b><small>Fine-grained with Contents: read and write, or classic with repo scope. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one</a></small></span><input type="password" id="ghTokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false" style="flex:1"><button class="btn primary" onclick="connectToken()">Connect</button></div>'+
         (inApp()?row('Sign in with a code','Needs your own GitHub OAuth app with Device Flow (Client ID below).','<button class="btn small" onclick="deviceSignIn()">Sign in</button>')+'<div class="row"><input type="text" placeholder="GitHub OAuth Client ID (optional)" value="'+esc(ls('gh_client_id')||'')+'" onchange="ls(\'gh_client_id\',this.value.trim())"></div>':''))+
    '</div></div>'+
    '<div class="group"><h3>Workspace</h3><div class="list">'+
      row('Claude team',teamMode()==='team'?'Manager plans · '+parallel()+' sub-agents at once':'Single sub-agent',icon('chev','ic chev'),'openTeam()')+
      row('Commit finished tasks automatically','Only when every edit applied. Otherwise you review first.',toggle('autoCommit',autoCommit(),"ls('auto_commit',this.checked?'1':'0')"))+
      '<div class="row"><span class="grow"><b>Your name</b><small>For the greeting.</small></span><input type="text" style="max-width:45%" value="'+esc(ls('my_name')||'')+'" placeholder="Optional" onchange="ls(\'my_name\',this.value.trim());renderThread()"></div>'+
    '</div></div>'+
    '<div class="group"><h3>Shared memory</h3><div class="list"><div class="row" style="flex-direction:column;align-items:stretch"><textarea id="memoryBox" maxlength="4000" placeholder="Facts and preferences every Claude account should know, like your stack or style." oninput="saveMemory(this.value)">'+esc(S.memory)+'</textarea><small id="memoryHint" style="color:var(--text-4)">'+S.memory.length+' / 4000 · stays on this device, never committed</small></div></div></div>'+
    '<div class="group"><h3>Appearance</h3><div class="list">'+row('Theme','',seg([['system','Auto'],['light','Light'],['dark','Dark']],theme,'setTheme'))+'</div></div>'+
    '<div class="group"><h3>App</h3><div class="list">'+
      row('App updates','Get new screens without reinstalling',icon('chev','ic chev'),'openAppUpdates()')+
      row('Clear sessions on this device','Removes conversations and unsaved edits. GitHub is not touched.','<button class="btn small danger" onclick="clearSessions()">Clear</button>')+
    '</div><p class="hint">AI Studio uses your own Claude accounts on claude.ai and your GitHub token. Nothing goes to any other server.</p></div>',null,'settings');
}
window.openSettings=openSettings;
function setTheme(v){ls('studio_theme',v);applyTheme();openSettings();}
function applyTheme(){const v=ls('studio_theme')||'system';if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);}
async function clearSessions(){
  if(!confirm('Delete every session and unsaved edit on this device?'))return;
  for(const id of Object.keys(S.sessions))await deleteSession(id);
  closeSheet();toast('Sessions cleared');
}

/* ===================== SHARED MEMORY ===================== */
// One memory for every account. In the app it lives in a device file the Claude tab uses too; it is never committed.
const MEMORY_MAX=4000;
let memoryTimer=0;
function saveMemory(v){
  S.memory=String(v||'').slice(0,MEMORY_MAX);ls('studio_memory',S.memory);
  const h=$('memoryHint');if(h)h.textContent=S.memory.length+' / 4000 · stays on this device, never committed';
  clearTimeout(memoryTimer);memoryTimer=setTimeout(()=>{if(inApp())native({op:'memorySet',text:S.memory.trim()}).catch(()=>{});},400);
}
async function syncMemoryFromNative(){
  if(!inApp())return;
  try{
    const remote=String((await native({op:'memoryGet'}))||'').trim(),local=(ls('studio_memory')||'').trim();
    if(!remote&&local)native({op:'memorySet',text:local}).catch(()=>{});
    else if(remote!==local){S.memory=remote;ls('studio_memory',remote);}
  }catch{}
}
window.syncMemoryFromNative=syncMemoryFromNative;

/* ===================== APP UPDATES (web layer, no new IPA) ===================== */
// The page never downloads code itself: the app checks GitHub, verifies the file and loads it.
function appUpdatesSheet(s,note){
  const running=s.running||0,built=s.builtIn||0,pending=!!s.installed&&s.installed!==s.running;
  const r=(t,d)=>'<div class="row"><span class="grow"><b>'+t+'</b><small>'+d+'</small></span></div>';
  let rows=r('Running v'+running,(running>built?'Downloaded update':'Built into this app')+' · built-in v'+built);
  if(pending)rows+=r('v'+s.installed+' is downloaded','Restart to apply it. Sessions and settings stay on this phone.');
  if(s.available&&s.needsNewApp)rows+=r('v'+s.available+' needs a new IPA','It uses native features this build doesn’t have. Install the latest IPA once.');
  else if(s.canInstall)rows+=r('v'+s.available+' is available','Downloads the new screens. No re-signing.');
  else if(s.available)rows+=r('Up to date','Latest published web version is v'+s.available+'.');
  const main=pending?'<button class="btn primary" onclick="appUpdateReload()">Restart to apply</button>'
    :s.canInstall?'<button class="btn primary" onclick="appUpdateInstall()">Download v'+s.available+'</button>'
    :'<button class="btn primary" onclick="appUpdateCheck()">Check for updates</button>';
  const reset=(running>built||s.installed)?'<button class="btn danger" onclick="appUpdateReset()">Reset to built-in</button>':'';
  return '<div class="group"><p class="hint" style="margin-top:0">Updates the workspace screens without reinstalling the IPA. Changes to the native app (tabs, Claude containers, sign-in) still need a new IPA.</p></div>'+
    '<div class="group"><div class="list">'+rows+'</div>'+(note?'<p class="hint">'+esc(note)+'</p>':'')+'</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end">'+reset+main+'</div>';
}
let _appUpd={};
function appUpdShow(note){showSheet('App updates',appUpdatesSheet(_appUpd,note||''),null,'updates');}
async function openAppUpdates(){
  if(!inApp()){showSheet('App updates','<p class="hint">In-app updates are available in the iPhone app. A browser loads the newest version when you reload.</p>');return;}
  try{_appUpd=(await native({op:'studioUpdateStatus'}))||{};}catch(e){_appUpd={};}
  appUpdShow('');
}
async function appUpdateCheck(){
  appUpdShow('Checking…');
  try{_appUpd=(await native({op:'studioUpdateCheck'}))||_appUpd;appUpdShow(_appUpd.canInstall||_appUpd.needsNewApp?'':'You have the latest version.');}
  catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateInstall(){
  appUpdShow('Downloading and verifying…');
  try{_appUpd=(await native({op:'studioUpdateInstall'}))||_appUpd;appUpdShow('Downloaded and verified.');}
  catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateReload(){
  if(!confirm('Restart now to apply the update? Sessions and settings stay on this phone.'))return;
  try{await native({op:'studioUpdateReload'});}catch(e){appUpdShow((e&&e.message)||String(e));}
}
async function appUpdateReset(){
  if(!confirm('Go back to the version built into this app?'))return;
  try{await native({op:'studioUpdateReset'});}catch(e){appUpdShow((e&&e.message)||String(e));}
}
/* end app updates */

/* ===================== START ===================== */
async function init(){
  applyTheme();
  $('sbSpark').innerHTML=spark();drawIcons();
  S.token=ls('gh_token')||'';S.user=lsj('gh_user');S.memory=ls('studio_memory')||'';
  await loadSessions();
  const last=ls('cur_session');
  if(last&&S.sessions[last])S.cur=last;else newSession(false);
  const s=sess();if(s&&!s.repo&&ls('repo')){s.repo=ls('repo');s.branch=ls('branch')||'';}
  const draft=ls('draft');if(draft){$('task').value=draft;autosize($('task'));}
  renderAll();scrollDown(true);
  window.studioInitialized=true;
  if(window.STUDIO_REQUEST_TAB==='settings')openSettings();
  syncMemoryFromNative();refreshProfiles();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshProfiles();});
  if(S.token&&!S.user)gh.gh('/user').then(u=>{S.user=u;ls('gh_user',JSON.stringify({login:u.login,avatar:u.avatar_url}));renderSidebar();}).catch(()=>{});
}
bootGitHubCredential().catch(e=>toast('GitHub secure sign-in is unavailable: '+e.message)).then(init);
</script>
